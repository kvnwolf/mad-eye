<svg
  aria-label="mad-eye app icon"
  height="1024"
  role="img"
  viewBox="0 0 1024 1024"
  width="1024"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="tile" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#242530" />
      <stop offset="1" stop-color="#131418" />
    </linearGradient>
    <radialGradient cx="0.42" cy="0.36" id="lens" r="0.78">
      <stop offset="0" stop-color="#fdfdfe" />
      <stop offset="1" stop-color="#e3e3ea" />
    </radialGradient>
  </defs>
  <!-- macOS-style squircle tile -->
  <rect fill="url(#tile)" height="864" rx="204" width="864" x="80" y="80" />
  <!-- glass lens -->
  <circle cx="512" cy="512" fill="url(#lens)" r="292" />
  <!-- bold ring -->
  <circle
    cx="512"
    cy="512"
    fill="none"
    r="262"
    stroke="#25262c"
    stroke-width="58"
  />
  <!-- iris + pupil, offset for a sidelong Mad-Eye glance -->
  <g transform="translate(26,-16)">
    <circle
      cx="512"
      cy="512"
      fill="none"
      r="94"
      stroke="#e0a23c"
      stroke-width="27"
    />
    <circle cx="512" cy="512" fill="#25262c" r="44" />
    <circle cx="529" cy="495" fill="#fdfdfe" r="14" />
  </g>
</svg>
